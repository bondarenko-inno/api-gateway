server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${services.uri.auth:http://localhost:9000}
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=1

            - id: user-service
              uri: ${services.uri.user:http://localhost:8071}
              predicates:
                - Path=/users/**
              filters:
                - StripPrefix=1

            - id: order-service
              uri: ${services.uri.order:http://localhost:8081}
              predicates:
                - Path=/orders/**
              filters:
                - StripPrefix=1


secret:
  key: ${SECRET_KEY}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health



server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URI:http://localhost:9000}
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=1

            - id: user-service
              uri: ${USER_SERVICE_URI:http://localhost:8071}
              predicates:
                - Path=/users/**
              filters:
                - StripPrefix=1

            - id: order-service
              uri: ${ORDER_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/orders/**
              filters:
                - StripPrefix=1


secret:
  key: ${SECRET_KEY}



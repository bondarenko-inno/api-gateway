apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: yahorbandarenka/auth-service
          ports:
            - containerPort: 9000
          env:
            - name: AUTH_SERVICE_POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: AUTH_SERVICE_POSTGRES_DB
            - name: AUTH_SERVICE_POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: AUTH_SERVICE_POSTGRES_USER
            - name: AUTH_SERVICE_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: AUTH_SERVICE_POSTGRES_PASSWORD
            - name: AUTH_SERVICE_POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: AUTH_SERVICE_POSTGRES_HOST
            - name: AUTH_SERVICE_POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: AUTH_SERVICE_POSTGRES_PORT
            - name: AUTH_SERVICE_KAFKA_HOST
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: AUTH_SERVICE_KAFKA_HOST
            - name: AUTH_SERVICE_KAFKA_PORT
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: AUTH_SERVICE_KAFKA_PORT
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: SECRET_KEY

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka-auth
spec:
  serviceName: kafka-auth
  replicas: 1
  selector:
    matchLabels:
      app: kafka-auth
  template:
    metadata:
      labels:
        app: kafka-auth
    spec:
      containers:
        - name: kafka-auth
          image: confluentinc/cp-kafka:7.5.0
          ports:
            - containerPort: 9092
          env:
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: zookeeper:2181
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://0.0.0.0:9092
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka-auth:9092
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
